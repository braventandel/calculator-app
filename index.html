<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="calculator_body">
            <div id="calculator">
                <div id="display">45 + 55 = 100</div>

                <div id="keyboard">
                    <div id="buttons">
                        <div id="btn_r1" class="row">
                            <button>AC</button><button>( )</button><button>%</button><button>÷</button>
                        </div>
                        <div id="btn_r2" class="row">
                            <button>7</button><button>8</button><button>9</button><button>x</button>
                        </div>
                        <div id="btn_r3" class="row">
                            <button>4</button><button>5</button><button>6</button><button>-</button>
                        </div>
                        <div id="btn_r4" class="row">
                            <button>1</button><button>2</button><button>3</button><button>+</button>
                        </div>
                        <div id="btn_r5" class="row">
                            <button>0</button><button>.</button><button>⌫</button><button>=</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>

        //Basic Math Functions
        const add = function (a, b) {
            return a + b;
        }

        const subtract = function (a, b) {
            return a - b;
        }

        const multiply = function (a, b) {
            return a * b;
        }

        const divide = function (a, b) {
            return a / b;
        }

        //Operate Function
        const operate = function (operator, num1, num2) {
            switch (operator) {
                case '+':
                    return add(num1, num2);
                case '-':
                    return subtract(num1, num2);
                case '*':
                    return multiply(num1, num2);
                case '/':
                    if (num2 === 0) return "Error: Can't Divide by Zero";
                    return divide(num1, num2);
                default:
                    return "Invalid Operator";
            }
        }
    </script>
</body>

</html>
